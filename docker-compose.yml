services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp2c}
      POSTGRES_USER: ${POSTGRES_USER:-erp2c}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeStrongDbPass2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp2c} -d ${POSTGRES_DB:-erp2c}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-erp2c}:${POSTGRES_PASSWORD:-ChangeMeStrongDbPass2026}@db:5432/${POSTGRES_DB:-erp2c}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      INIT_ORG_NAME: ${INIT_ORG_NAME:-Моя компанія}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8088}:80"

volumes:
  pg_data:
